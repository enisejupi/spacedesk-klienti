# 🔔 SpaceDesk — pamjet iOS nga Simulatori, i nxjerrë nga `flutter-build.yml`.
#
# 🚨 MOS E SHKRUAJ ME DORË. Prodhohet nga `klienti/nxirr-ios.py` te depoja
# `spacedesk` (Gitea). Ndreq skriptin dhe nise sërish ([[vegla-nje-burim-i-vetem]]).
name: SpaceDesk pamjet iOS

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.4.9"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
  BUNDLE_ID: "tech.spacecode.desk"
  APPLE_TEAM_ID: "WUU9UVHFKF"
  DEMO_ID: "468543837"
  DEMO_PASS: "SpaceDeskReview2026"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-rustdesk-ios:
    timeout-minutes: 150
    name: pamjet ios nga simulatori
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-apple-ios,
              os: macos-latest,
              vcpkg-triplet: arm64-ios,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Ngul marken SpaceDesk
        env:
          SPACEDESK_RRENJA: ${{ github.workspace }}
        run: |
          python3 spacecode/marka.py
          grep -q 'RENDEZVOUS_SERVERS: &\[&str\] = &\["desk.spacecode.tech"\]' libs/hbb_common/src/config.rs \
            || { echo "⛔ serveri nuk u ngul — pamjet do tregonin rs-ny.rustdesk.com"; exit 1; }
          sed -i '' "s/com\.carriez\.flutterHbb/$BUNDLE_ID/g" flutter/ios/Runner.xcodeproj/project.pbxproj
          # vetëm arm64 te simulatori — lib-i Rust s'ka x86_64
          sed -i '' 's/\(IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;\)/\1 "EXCLUDED_ARCHS[sdk=iphonesimulator*]" = x86_64;/' \
            flutter/ios/Runner.xcodeproj/project.pbxproj
          grep -c 'EXCLUDED_ARCHS\[sdk=iphonesimulator' flutter/ios/Runner.xcodeproj/project.pbxproj
          # ffmpeg-u vetëm për hwcodec — jashtë. Edhe çdo varësi `host: true` jashtë:
          # simulatori lidh vetëm bibliotekat e target-it, ndërsa libjpeg-turbo:arm64-osx
          # binte te runner-i («math cannot parse " * 8"», xhirimi 36124299960, 25-09).
          python3 - <<'EOF'
          import json
          v = json.load(open("vcpkg.json"))
          v["dependencies"] = [d for d in v["dependencies"]
                               if not (isinstance(d, dict) and (d.get("host") or d.get("name") == "ffmpeg"))]
          json.dump(v, open("vcpkg.json", "w"), indent=2)
          EOF
          ! grep -q '"host": true' vcpkg.json || { echo "⛔ varësitë host mbetën"; exit 1; }
          ! grep -q '"ffmpeg"' vcpkg.json || { echo "⛔ ffmpeg mbeti"; exit 1; }
          grep -q '"libvpx"' vcpkg.json || { echo "⛔ filtri hoqi edhe target-in"; exit 1; }

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: ${{ matrix.job.target }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo build --locked --features flutter --release --target aarch64-apple-ios --lib
          A=target/aarch64-apple-ios/release/liblibrustdesk.a
          rm -rf /tmp/sim && python3 - "$A" /tmp/sim <<'EOF'
          # Arkivi ar → çdo anëtar Mach-O 64 shënohet «iOS-simulator» (platforma 7), si arm64-to-sim:
          #  · LC_BUILD_VERSION: platforma 2 → 7, në vend;
          #  · LC_VERSION_MIN_IPHONEOS (16 B) → LC_BUILD_VERSION (24 B): të dhënat pas komandave
          #    zhvendosen +8, dhe çdo offset skedari (segmentet, seksionet, relokimet, simbolet,
          #    linkedit) +8. Pastaj arkivi rindërtohet me libtool (tabela e simboleve e re).
          import os, struct, sys
          f, D = sys.argv[1], sys.argv[2]
          b = open(f, "rb").read()
          assert b[:8] == b"!<arch>\n", "s'është arkiv ar"
          LINKEDIT = (0x26, 0x29, 0x2E, 0x1E, 0x2B, 0x33, 0x34)   # linkedit_data_command: dataoff te +8

          def sim(m):
              m = bytearray(m)
              if struct.unpack_from("<I", m, 0)[0] != 0xFEEDFACF:
                  return bytes(m), "tjeter"
              ncmds, sz = struct.unpack_from("<II", m, 16)
              c, vm = 32, None
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<II", m, c)
                  if cmd == 0x32:
                      if struct.unpack_from("<I", m, c + 8)[0] == 2:
                          struct.pack_into("<I", m, c + 8, 7)
                      return bytes(m), "ndrequr"
                  if cmd == 0x25:
                      vm = (c, size)
                  c += size
              if vm is None:
                  return bytes(m), "pa-version"
              vc, vsize = vm
              minos, sdk = struct.unpack_from("<II", m, vc + 8)
              S, kufi = 24 - vsize, 32 + sz
              c = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<II", m, c)
                  def zh(off, w="<I"):
                      v = struct.unpack_from(w, m, c + off)[0]
                      if v >= kufi:
                          struct.pack_into(w, m, c + off, v + S)
                  if cmd == 0x19:                                   # LC_SEGMENT_64
                      if struct.unpack_from("<Q", m, c + 48)[0]:    # filesize
                          zh(40, "<Q")
                      for s in range(struct.unpack_from("<I", m, c + 64)[0]):
                          o = c + 72 + 80 * s
                          for off in (48, 56):                      # offset, reloff
                              v = struct.unpack_from("<I", m, o + off)[0]
                              if v >= kufi:
                                  struct.pack_into("<I", m, o + off, v + S)
                  elif cmd == 0x2:                                  # LC_SYMTAB
                      zh(8); zh(16)
                  elif cmd == 0xB:                                  # LC_DYSYMTAB
                      for off in (32, 40, 48, 56, 64, 72):
                          zh(off)
                  elif cmd in LINKEDIT:
                      zh(8)
                  c += size
              bv = struct.pack("<IIIIII", 0x32, 24, 7, minos, sdk, 0)
              out = m[:vc] + bv + m[vc + vsize:kufi] + m[kufi:]
              struct.pack_into("<I", out, 20, sz + S)
              return bytes(out), "zgjeruar"

          os.makedirs(D)
          i, n, num = 8, 0, {}
          while i + 60 <= len(b):
              emri = b[i:i+16].decode("ascii", "replace").strip()
              sa = int(b[i+48:i+58].decode().strip())
              t, fund = i + 60, i + 60 + sa
              if emri.startswith("#1/"):
                  k = int(emri[3:]); emri = b[t:t+k].rstrip(b"\0").decode("utf-8", "replace"); t += k
              i = fund + (fund & 1)
              if emri.startswith("__.SYMDEF") or emri in ("/", "//"):
                  continue
              m, gjendja = sim(b[t:fund])
              num[gjendja] = num.get(gjendja, 0) + 1
              n += 1
              open(os.path.join(D, "%06d_%s" % (n, os.path.basename(emri) or "o")), "wb").write(m)
          print("anëtarë:", n, num)
          assert num.get("ndrequr", 0) + num.get("zgjeruar", 0) > 0, "asnjë objekt s'u ndërrua"
          EOF
          rm -f "$A" && (cd /tmp/sim && ls | sort > ../lista && xcrun libtool -static -o "$OLDPWD/$A" -filelist ../lista)
          # Në skedar, jo me tub: `! otool | grep -q` me pipefail kalon nga SIGPIPE edhe kur gjen.
          otool -l "$A" > /tmp/ol.txt
          echo "platform 7: $(grep -c "platform 7" /tmp/ol.txt) · platform 2: $(grep -c "platform 2$" /tmp/ol.txt || true)"
          ! grep -q LC_VERSION_MIN_IPHONEOS /tmp/ol.txt || { echo "⛔ mbetën VERSION_MIN"; exit 1; }
          ! grep -q "platform 2$" /tmp/ol.txt || { echo "⛔ mbetën objekte iOS"; exit 1; }
          # Diagnoza (17-10): a i sheh ld-ja simbolet Rust te arkivi i shndërruar?
          nm -gU "$A" 2>/dev/null | grep -E " T _(drop_dart_object|wire_cm_can_elevate)$" || echo "⚠️ simbolet Rust s'janë te tabela"
          echo 'extern void drop_dart_object(void*); int main(void){drop_dart_object(0);return 0;}' > /tmp/t.c
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios13.0-simulator /tmp/t.c "$A" -o /tmp/t \
            -Wl,-undefined,dynamic_lookup 2>&1 | grep -v "^ld: warning: object file" | head -20 || true
          nm /tmp/t 2>/dev/null | grep drop_dart_object || echo "⚠️ lidhja-provë s'u krijua"
          lipo -info "$A"

          
      - name: Ndertimi per Simulator
        shell: bash
        run: |
          set -e
          cd flutter
          flutter build ios --simulator --debug --no-codesign
          echo "APP_PATH=$PWD/build/ios/iphonesimulator/Runner.app" >> "$GITHUB_ENV"

      - name: Kap pamjet
        # PA `set -e`: një pajisje që mungon kapërcehet; hapi bie vetëm pa asnjë pamje.
        run: |
          set -u
          mkdir -p pamjet
          runtime=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          URL="rustdesk://${DEMO_ID}?password=${DEMO_PASS}"
          for pajisja in "iPhone 16 Pro Max" "iPhone 17 Pro Max" "iPad Pro 13-inch (M4)" "iPad Pro 13-inch (M5)"; do
            echo "── $pajisja"
            tipi=$(xcrun simctl list devicetypes | grep -F "$pajisja (" \
                   | sed -E 's/.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]*)\).*/\1/' | head -1)
            [ -n "$tipi" ] || { echo "   ⚠️  s'ka tip"; continue; }
            udid=$(xcrun simctl create "sd-$RANDOM" "$tipi" "$runtime")
            emri=$(echo "$pajisja" | tr ' ()' '-' | tr -s '-' | sed 's/-$//')
            xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "09:41" --batteryState charged \
              --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
            xcrun simctl install "$udid" "$APP_PATH" || { echo "   ⚠️  install"; continue; }
            xcrun simctl privacy "$udid" grant all "$BUNDLE_ID" 2>/dev/null
            # 🎬 Videoja për shqyrtuesin (porta-dorezimi e kërkon): e gjithë rrjedha,
            #    nisja → seanca me kompjuterin demo. SIGINT e mbyll .mov-in si duhet.
            xcrun simctl io "$udid" recordVideo --codec=h264 --force "pamjet/$emri.mov" &
            rec=$!; sleep 3
            # 1 — ekrani i parë: fusha e ID-së
            xcrun simctl launch "$udid" "$BUNDLE_ID"; sleep 20
            xcrun simctl io "$udid" screenshot "pamjet/$emri-1.png"
            # 2, 3 — seanca me kompjuterin demo, nga nisje e ftohtë me URL
            xcrun simctl terminate "$udid" "$BUNDLE_ID"; sleep 2
            xcrun simctl openurl "$udid" "$URL"; sleep 40
            xcrun simctl io "$udid" screenshot "pamjet/$emri-2.png"
            sleep 20
            xcrun simctl io "$udid" screenshot "pamjet/$emri-3.png"
            kill -INT "$rec"; wait "$rec"
            xcrun simctl shutdown "$udid"
          done
          nr=$(ls pamjet/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "── $nr pamje"
          [ "$nr" -gt 0 ] || { echo "❌ asnjë pamje"; exit 1; }
          for f in pamjet/*.png; do echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"; done

      - name: Upload pamjet (SpaceDesk)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacedesk-pamje-ios
          path: pamjet/
          if-no-files-found: warn

