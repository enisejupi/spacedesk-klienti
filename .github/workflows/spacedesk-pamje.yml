# 🖼️ SpaceDesk — ndërtim Linux + kapje e pamjeve të dyqanit.
#
# 🚨 MOS E SHKRUAJ ME DORË. Prodhohet nga `klienti/nxirr-pamje.py`.
#
# Prodhon artefaktin `spacedesk-pamjet`. Pamjet ngarkohen te Play me
# `linux-install/tools/play-pamje.mjs`.
name: SpaceDesk pamjet

on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "spacedesk-pamje"

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.4.9"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-rustdesk-linux:
    needs: [generate-bridge]
    name: build rustdesk linux ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        # use a high level qemu-user-static
        job:
          - {
              arch: x86_64,
              target: x86_64-unknown-linux-gnu,
              distro: ubuntu18.04,
              on: ubuntu-22.04,
              deb_arch: amd64,
              vcpkg-triplet: x64-linux,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
            sudo apt-get install -y qemu-user-static
          fi

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # 🖼️🚨 SpaceDesk: detyro UI-në MOBILE te një ndërtim Linux.
      # Pa këtë, `main.dart` nis pamjen desktop dhe pamjet dalin të gabuara.
      # Roja: nëse rrjedha kryesore e ndryshon rreshtin, puna BIE këtu — nuk
      # vazhdon e gjelbër me një `sed` që nuk preku asgjë.
      - name: Arno isDesktop_ per pamjet mobile
        run: |
          F=flutter/lib/native/common.dart
          echo "── para ──"; grep -n 'isDesktop_' "$F"
          grep -q '^final isDesktop_ = Platform.isWindows' "$F" || {
            echo "⛔ rreshti i isDesktop_ nuk duket si i pritur — arnimi u ndal"; exit 1; }
          sed -i 's|^final isDesktop_ = Platform.isWindows.*$|final isDesktop_ = false; // SpaceDesk: pamjet e dyqanit|' "$F"
          echo "── pas ──"; grep -n 'isDesktop_' "$F"
          grep -q '^final isDesktop_ = false;' "$F" || { echo "⛔ arnimi nuk zuri vend"; exit 1; }

      # 🏷️🚨 MARKA. Deri më 10-09-2026 ky tubacion ndërtonte PA markë, dhe
      # pamjet dilnin me «RustDesk» te shiriti i sipërm — pra do të ngarkoheshin
      # te një listim me emrin SpaceDesk. Pikërisht kategoria «metadata që nuk
      # përputhet me app-in», e njëjta që rrëzoi Hartën.
      # `spacecode/marka.py` është i NJËJTI skedar që xhiron edhe te Ampere;
      # bie me dalje 1 nëse rrjedha kryesore ndryshon ndonjë nga modelet e tij.
      - name: Ngul marken SpaceDesk
        env:
          SPACEDESK_RRENJA: ${{ github.workspace }}
        run: |
          python3 spacecode/marka.py
          echo "── verifikim i pavarur ──"
          grep -n 'APP_NAME: RwLock' libs/hbb_common/src/config.rs
          grep -q 'RwLock::new("SpaceDesk".to_owned())' libs/hbb_common/src/config.rs \
            || { echo "⛔ APP_NAME nuk u ngul"; exit 1; }
          grep -q 'RENDEZVOUS_SERVERS: &\[&str\] = &\["desk.spacecode.tech"\]' libs/hbb_common/src/config.rs \
            || { echo "⛔ serveri nuk u ngul"; exit 1; }

      - name: Set Swap Space
        if: ${{ matrix.job.arch == 'x86_64' }}
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Restore bridge files
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build rustdesk
        id: vcpkg
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        with:
          arch: ${{ matrix.job.arch }}
          distro: ${{ matrix.job.distro }}
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # we have libopus compiled by us.
            apt-get remove -y libopus-dev || true
            # output devs
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            # rust
            pushd /opt
            # do not use rustup, because memory overflow in qemu
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}
            # edit config
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config
            # start build
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            if [[ "${{ matrix.job.arch }}" == "aarch64" ]]; then
              export JOBS="--jobs 3"
            else
              export JOBS=""
            fi
            echo $JOBS
            cargo build --locked --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            # Setup Flutter
            # disable git safe.directory
            git config --global --add safe.directory "*"
            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                export PATH=/opt/flutter-elinux/bin:$PATH
                sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
                sed -i "s/x64\/release/arm64\/release/g" ./build.py
              ;;
              x86_64)
                export PATH=/opt/flutter/bin:$PATH
              ;;
            esac
            popd
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            case ${{ matrix.job.arch }} in
              aarch64)
                # clone repo and reset to flutter ${{ env.FLUTTER_VERSION }}
                git clone https://github.com/sony/flutter-elinux.git || true
                pushd flutter-elinux
                  git fetch
                  git reset --hard ${{ env.FLUTTER_VERSION }}
                  bin/flutter-elinux doctor -v
                  bin/flutter-elinux precache --linux
                popd
                cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
                rm -rf flutter
              ;;
              x86_64)
                flutter doctor -v
              ;;
            esac

            if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
              case ${{ matrix.job.arch }} in
                aarch64)
                  pushd /opt/flutter-elinux/flutter
                ;;
                x86_64)
                  pushd /opt/flutter
                ;;
              esac
              git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            # build flutter
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=${{ matrix.job.deb_arch }}
            python3 ./build.py --flutter --skip-cargo
            for name in rustdesk*??.deb; do
              mv "$name" "${name%%.deb}-${{ matrix.job.arch }}.deb"
            done

            # rpm package
            echo -e "start packaging fedora package"
            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter.spec
                ;;
            esac
            HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
            pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
            for name in rustdesk*??.rpm; do
                mv "$name" /workspace/"${name%%.rpm}.rpm"
            done

            # rpm suse package
            echo -e "start packaging suse package"
            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter-suse.spec
                ;;
            esac
            HBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb
            pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
            for name in rustdesk*??.rpm; do
                mv "$name" /workspace/"${name%%.rpm}-suse.rpm"
            done

      # 🖼️ Kapja. App-i xhiron te një ekran 1080×1920 (raport telefoni), dhe
      # pamjet merren nga VETË app-i — jo nga shfletuesi, se ky s'është faqe web.
      #
      # 🚨 XHIRIMI I PARË (34453392902) DOLI I GJELBËR ME PESË PAMJE BOSHE prej
      #    407 bajtësh. Shkaku te `app.log`: «Couldn't open libEGL.so.1».
      #    Flutter-i Linux vizaton me GL/EGL; runner-i i GitHub-it nuk i ka, dhe
      #    Xvfb-ja pa GLX nuk jep as llvmpipe. App-i nuk hapi kurrë dritare,
      #    `import -window root` kapi ekranin bosh, dhe `|| true` e fshehu.
      #    Prandaj tani: bibliotekat GL, `+extension GLX`, dhe një ROJË në fund.
      - name: Kap pamjet nen Xvfb
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb x11-utils xdotool imagemagick \
            libegl1 libgl1 libgles2 libgl1-mesa-dri libglu1-mesa mesa-utils \
            dbus-x11 at-spi2-core libayatana-appindicator3-1 || true
          sudo apt-get install -y ./rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb \
            || sudo apt-get -f install -y
          export DISPLAY=:99
          # llvmpipe: pa GPU, vizatimi bëhet te CPU-ja. Pa këtë, EGL-ja bie sërish.
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export GDK_BACKEND=x11
          Xvfb :99 -screen 0 1080x1920x24 +extension GLX +render -nolisten tcp &
          for i in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          glxinfo -B 2>&1 | head -5 || true
          mkdir -p pamjet
          BIN="$(command -v rustdesk || command -v spacedesk || echo /usr/bin/rustdesk)"
          echo "binari: $BIN"
          "$BIN" > pamjet/app.log 2>&1 &
          sleep 25

          # 🚨 Dritarja, JO rrënja. Xhirimi i mëparshëm kapte `-window root`:
          #    dritarja e app-it ishte ~1080×800 te një rrënjë 1080×1920, pra
          #    58% e çdo pamjeje ishte E ZEZË — dhe roja e ngjyrave e kaloi,
          #    sepse 598 ngjyra te pjesa e sipërme mjaftojnë.
          WID=""
          for i in $(seq 1 20); do
            WID=$(xdotool search --onlyvisible --name . 2>/dev/null | tail -1)
            [ -n "$WID" ] && break
            sleep 3
          done
          [ -n "$WID" ] || { echo "⛔ asnjë dritare e dukshme"; tail -40 pamjet/app.log; exit 1; }
          xdotool windowsize  "$WID" 1080 1920
          xdotool windowmove  "$WID" 0 0
          xdotool windowactivate "$WID" || true
          sleep 6
          xdotool getwindowname "$WID" | tee pamjet/dritaret.txt
          xdotool getwindowgeometry "$WID" | tee -a pamjet/dritaret.txt

          kap() {   # kap <emri>
            sleep 6
            import -window "$WID" "pamjet/$1.png"
            echo "  kapur: $1 -> $(identify -format '%wx%h %k ngjyra' "pamjet/$1.png")"
          }

          # Tri ekrane të NDRYSHME. Xhirimi i mëparshëm kapte pesë herë të
          # njëjtin ekran — pesë skedarë byte për byte identikë, kurse Play-i
          # kërkon dy pamje të ndryshme.
          kap 1-lidhja
          # Skeda «Settings» te shiriti i poshtëm: ~3/4 e gjerësisë, fundi.
          xdotool mousemove 810 1850 click 1 || true
          kap 2-cilesimet
          xdotool mousemove 270 1850 click 1 || true   # kthehu te «Connection»
          xdotool mousemove 540 130  click 1 || true   # fusha «Remote ID»
          xdotool type --delay 120 "123456789"  || true
          kap 3-id-ja

          ls -la pamjet
          tail -40 pamjet/app.log || true

          # ─────────────────────────── ROJA ───────────────────────────
          # 🚨 Roja e vjetër mati vetëm numrin e ngjyrave dhe praninë e një
          #    dritareje. Të dyja kaluan mbi një pamje 58% të zezë, me markën e
          #    gabuar, të përsëritur pesë herë. Tani maten të KATËR gjërat që
          #    dështuan vërtet.
          gabime=0

          # ① Marka. Kjo është matja që e kap defektin e vërtetë: emri i
          #    dritares vjen nga APP_NAME.
          if ! grep -qi "spacedesk" pamjet/dritaret.txt; then
            echo "⛔ ① emri i dritares nuk përmban «SpaceDesk»:"; cat pamjet/dritaret.txt
            gabime=$((gabime+1))
          fi

          for f in pamjet/[0-9]-*.png; do
            # ② Përmasa. Kapja nga dritarja duhet të japë saktësisht 1080×1920.
            wh=$(identify -format "%wx%h" "$f")
            [ "$wh" = "1080x1920" ] || { echo "⛔ ② $f është $wh, jo 1080x1920"; gabime=$((gabime+1)); }
            # ③ Përmbajtja: as bosh, as pothuaj krejt e errët.
            k=$(identify -format "%k" "$f"); mes=$(identify -format "%[fx:mean]" "$f")
            echo "   $f -> $wh, $k ngjyra, ndriçim mesatar $mes"
            [ "$k" -ge 16 ] || { echo "⛔ ③ $f praktikisht bosh ($k ngjyra)"; gabime=$((gabime+1)); }
            awk -v m="$mes" 'BEGIN{ exit (m > 0.10) ? 0 : 1 }' \
              || { echo "⛔ ③ $f është pothuaj krejt e errët (mesatarja $mes)"; gabime=$((gabime+1)); }
          done

          # ④ Ndryshueshmëria. Play-i do DY pamje të ndryshme; pesë kopje të së
          #    njëjtës janë një pamje.
          ndryshe=$(md5sum pamjet/[0-9]-*.png | awk '{print $1}' | sort -u | wc -l)
          echo "   pamje të ndryshme: $ndryshe"
          [ "$ndryshe" -ge 2 ] || { echo "⛔ ④ të gjitha pamjet janë identike"; gabime=$((gabime+1)); }

          [ "$gabime" -eq 0 ] || { echo "⛔ $gabime kontrolle ranë — artefakti NUK ngarkohet te Play"; exit 1; }
          echo "✅ $ndryshe pamje 1080×1920, me markë, me përmbajtje"


      - name: Ngarko pamjet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacedesk-pamjet
          path: pamjet/
